  verified_by: ["modules/workflows/conformance/test_operations.test.js::a review workflow takes a decision per row with the note trimmed, its demand names the rows still undecided, and it cannot advance until every row is decided (C-006, C-008; SL-07 criterion 3; REQ-008)", "modules/workflows/conformance/test_operations.test.js::a hazard the query omits is reported by reviewOmissions with registry's reason, is not asked for, and is recorded as an omission entry at completion (C-006, C-008; SL-07 criterion 3; HZ-004, REQ-008)", "modules/workflows/conformance/test_errors.test.js::review-the-hazards refuses a hazard that is not a row of the platform's query — not linked, not live, or omitted — with HazardNotInReviewError carrying both ids (C-006, section 4; HZ-004)"]
