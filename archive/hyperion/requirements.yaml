  verified_by: ["modules/reports/conformance/test_operations.test.js::C-003 and C-004: produceReport on a live platform holds the platform's name and every row and omission of registry.listPlatformHazards, in order, with each control's state and justification and the residual values; read back by getReport and added to listReports (REQ-007; SL-09 criterion 2)", "modules/reports/conformance/test_invariants.test.js::C-004, HZ-004: with hazards omitted for a malformed rating, a malformed justification, and a malformed control, a report's rows and omitted are exactly the query's, each hazard linked and live once and in neither twice (REQ-007; SL-09 criterion 2)"]
  validation_class: conservation
  validated_by: TBD
