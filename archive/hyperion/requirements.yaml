  allocated_to: views   # views C-027: an operation whose registry.platformsAffected gives more than one platform resolves with the confirm-edit screen listing every one of them and changes nothing until confirmEdit, so the list is passed rather than shown alongside the edit. The derivation is registry C-024's, so the platforms warned about are the platforms that then await acknowledgement (DEC-017). At views 8.0 the clause covers the five changing workflow operations too, gated on platformsAffected of the workflow's subject, which is the ref DEC-026 derives each entry's affectedPlatformIds from, and states the invariant outright: an operation is gated exactly when the entry its act appends carries two or more platform ids (DEC-021, DEC-024, DEC-027)
  verification_method: test
  verified_by: ["modules/views/conformance/test_operations.records.test.js::each of the four changing operations of the hazard screen, on a hazard on two platforms, shows the confirm-edit screen: the pending edit untrimmed, every platform platformsAffected gives named, and nothing changed, told, or written (C-027)", "modules/views/conformance/test_operations.records.test.js::confirmEdit makes exactly the call the gated operation would have made, tells store, and shows that operation's screen; the entry it appends awaits exactly the platforms the confirm-edit screen listed (C-027, C-026, C-012)", "modules/views/conformance/test_invariants.test.js::over seeded links and edits, an operation of C-027 shows the confirm-edit screen exactly when platformsAffected of its ref gives two or more platforms, lists them, and the entry the act then appends reaches exactly that list; an ungated act's entry reaches fewer than two (C-027, C-026)"]
  validation_class: invariant
  validated_by: TBD
  status: traced
