  kind: functional
  source: HZ-004
  allocated_to: views
  verification_method: test
  verified_by: ["modules/views/conformance/test_operations.records.test.js::openPlatform shows exactly the one listPlatformHazards: the platform, each row with the band rating gives for its residual, the omitted, and as linkable every live hazard in neither (C-020, C-021)", "modules/views/conformance/test_operations.records.test.js::a body whose rating record is malformed shows the hazard in omitted, not in rows, with one error naming its id and the omitting record's key (C-020; HZ-004)", "modules/views/conformance/test_operations.workflows.test.js::a review workflow on a platform whose rating record is malformed names the hazard in omitted with one error message, never in rows (C-037, C-020; HZ-004)", "modules/views/conformance/test_invariants.test.js::over seeded states, every screen that lists a platform's hazards or shows a hazard's controls on a platform agrees with the one listPlatformHazards: the platform screen, a review workflow, the prepare-report screen, the filter, a hazard's own screen, the assessment, the bow-tie, and the dashboard (C-020, C-021, C-024, C-044 to C-046)"]
