# Requirements for Pivot (G1). Hazard-driven first; allocation, verification and validation references TBD until G2 and G3.
# Terms: "link" is the one word for every stored relationship (hazard to platform, control to hazard, control to platform, reference entry to anything).
# A report is a document Pivot produces. A review is the review-data workflow (REQ-037). An assessment is any list of a platform's hazards that Pivot shows.
# An open item is anything awaiting a user's action; REQ-049 and REQ-068 name the kinds known so far, not an exhaustive set.
- id: REQ-001
  statement: Pivot shall show a control as linked to a platform only when a stored link between that control and that platform exists
  kind: functional
  source: HZ-001
  allocated_to: registry   # registry C-013 with C-021: a live control-platform link is the only thing that puts a control on a platform, and views shows the state it gives
  verification_method: test
  verified_by: ["modules/registry/conformance/test_invariants.test.js::HZ-001: over random confirmations and exclusions of a hazard's controls on its platforms, every triple is confirmed, excluded, or awaiting and never two; the state every row shows is the one C-021 derives; superseded rows stay with status deleted (C-020, C-021; SL-04 criteria 1, 2 and 4)", "modules/registry/conformance/test_operations.test.js::confirmControlForPlatform puts one control on one platform for one hazard by one link stamped with who and when, records it, and the row shows it confirmed with that confirmation (C-013, C-021, C-022, C-023; SL-04 criteria 1 and 4; HZ-007)", "modules/registry/conformance/test_operations.test.js::a confirmation names all three ids: the same control confirmed for one hazard on a platform is not on that platform for another hazard (C-013, DEC-013; SL-03 criterion 3)"]
  validation_class: invariant
  validated_by: TBD
  status: traced
- id: REQ-002
  statement: For each hazard linked to a platform, Pivot shall show every one of the hazard's controls that is not linked to that platform, with its recorded justification
  kind: functional
  source: HZ-001
  allocated_to: views   # views C-024: every one of a hazard's controls is shown against the platform in the state registry C-019 and C-021 give it, an excluded one carrying the reason stored and an awaiting one shown as awaiting
  verification_method: test
  verified_by: ["modules/views/conformance/test_operations.records.test.js::every one of a hazard's controls is shown on the assessment and the platform row in the state registry gives it: confirmed with who and when, excluded with the reason stored, awaiting with neither, each with the hazard's own control kind (C-024)", "modules/views/conformance/test_operations.records.test.js::confirmControlForPlatform and excludeControlFromPlatform each move exactly one control: confirmed by the active profile, or excluded with the reason trimmed; every other control, both ratings, the same control on another platform, and the hazard's detail are as they were (C-025, C-022)", "modules/views/conformance/test_invariants.test.js::over seeded states, every screen that lists a platform's hazards or shows a hazard's controls on a platform agrees with the one listPlatformHazards: the platform screen, a review workflow, the prepare-report screen, the filter, a hazard's own screen, the assessment, the bow-tie, and the dashboard (C-020, C-021, C-024, C-044 to C-046)"]
  validation_class: invariant
  validated_by: TBD
  status: traced
- id: REQ-003
  statement: Pivot shall show the residual consequence and likelihood of a hazard on a platform exactly as the assessor entered them, and shall never adjust them from the controls linked to that platform
  kind: functional
  source: HZ-002
  allocated_to: registry
  verification_method: test
  verified_by: ["modules/registry/conformance/test_invariants.test.js::HZ-002: whatever controls are linked, confirmed, or excluded and whatever platforms a hazard joins, the residual values read back are exactly the last ones setRating was given for that hazard, platform, and stage (C-017; SL-03 criterion 5)", "modules/registry/conformance/test_operations.test.js::setRating stores the values exactly as entered per hazard, platform, and stage; a second call updates the one record keeping its id and creation stamp; getRatings gives both stages; each act is recorded (C-017, C-018, C-023; SL-03 criterion 5; HZ-002)"]
  validation_class: invariant
  validated_by: TBD
  status: traced
