<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HighCom Splash</title>
<meta name="description" content="Splash animation for the HIGHCOM logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: one full-height stage with the lockup centred, a quiet control strip underneath.
     Dark-first, because the dark-background lockup is the splash; light mirrors the light-background logo. */
  :root {
    --bg: #050505;        /* splash ground */
    --bg-lift: #151413;   /* faint centre lift, warm-biased toward the orange */
    --fg: #ffffff;        /* logo ink */
    --accent: #fa9a26;    /* HIGHCOM orange */
    --sheen-core: #ffd8a6; /* hot centre of the lock sheen */
    --muted: #8c8680;     /* control labels */
    --line: #2b2825;      /* control borders */
    --font-ui: "Chakra Petch", "Bahnschrift", "Arial Narrow", system-ui, sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ecebe8; --bg-lift: #ffffff; --fg: #000000; --accent: #fa9a26;
      --muted: #6d6761; --line: #d6d2cd; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #ecebe8; --bg-lift: #ffffff; --fg: #000000; --accent: #fa9a26;
    --muted: #6d6761; --line: #d6d2cd; color-scheme: light;
  }
  /* manual background switch, independent of the viewer's theme */
  body[data-bg="dark"] {
    --bg: #050505; --bg-lift: #151413; --fg: #ffffff; --muted: #8c8680; --line: #2b2825; color-scheme: dark;
  }
  body[data-bg="light"] {
    --bg: #ecebe8; --bg-lift: #ffffff; --fg: #000000; --muted: #6d6761; --line: #d6d2cd; color-scheme: light;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
    transition: background-color .3s ease;
  }
  .stage {
    position: relative;
    display: grid;
    place-items: center;
    padding-inline: 16px;
    min-height: 0;
    cursor: pointer;
    background: radial-gradient(ellipse 58% 52% at 50% 50%, var(--bg-lift), var(--bg) 72%);
    -webkit-tap-highlight-color: transparent;
  }
  .flash {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%, var(--accent), transparent 42%);
  }
  #logo {
    position: relative;
    width: min(100%, 860px);
    height: auto;
    max-height: 100%;
    overflow: visible;
  }
  #logo .ink, #logo .letter { fill: var(--fg); }
  #logo .letter { fill-rule: evenodd; }
  #logo .trace { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linejoin: miter; stroke-linecap: square; }
  #logo .spark, #logo .hot { fill: var(--accent); }

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 14px;
    padding-inline: 16px;
    padding-block: 14px 20px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .bar button {
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 8px 12px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .bar button:hover { color: var(--fg); border-color: var(--muted); }
  .bar button:focus-visible, .scrub input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
  #replay { color: var(--fg); border-color: var(--muted); }
  .seg { display: flex; }
  .seg button + button { border-left: 0; }
  .scrub { display: flex; align-items: center; gap: 10px; }
  .scrub input { width: 200px; accent-color: var(--accent); margin: 0; }
  .scrub output {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    text-transform: none;
    min-width: 8.5ch;
    color: var(--fg);
  }
  .scrub output span { color: var(--muted); }
  @media (max-width: 520px) {
    .scrub { flex: 1 1 100%; justify-content: center; }
    .scrub input { flex: 1; width: auto; min-width: 0; }
  }
</style>
<style>body{margin:0}</style>
</head>
<body>
<main class="stage" id="stage" title="Click to replay">
  <div class="flash" id="flash"></div>
  <svg id="logo" viewBox="-70 -95 1004 396" role="img" aria-label="HIGHCOM">
    <defs>
      <clipPath id="sil-clip"><path d="M0,0 L185,0 L185,138.41 L92.5,206.4 L0,138.41 Z"/></clipPath>
      <clipPath id="stripe-clip"><rect x="136" y="-40" width="70" height="260"/></clipPath>
      <clipPath id="word-clip"><rect id="word-clip-rect" x="197" y="-60" width="800" height="300"/></clipPath>
      <clipPath id="ink-clip"><use href="#frame"/><use href="#column"/><use href="#leg"/><use href="#crossbar"/><use href="#st0"/><use href="#st1"/><use href="#st2"/><use href="#st3"/><use href="#st4"/></clipPath>
      <clipPath id="hot-clip"><rect x="138.8" y="-40" width="70" height="260"/></clipPath>
      <linearGradient id="sheen-grad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" style="stop-color: var(--accent); stop-opacity: 0"/>
        <stop offset=".2" style="stop-color: var(--accent); stop-opacity: .12"/>
        <stop offset=".36" style="stop-color: var(--accent); stop-opacity: .5"/>
        <stop offset=".5" style="stop-color: var(--sheen-core); stop-opacity: .95"/>
        <stop offset=".64" style="stop-color: var(--accent); stop-opacity: .5"/>
        <stop offset=".8" style="stop-color: var(--accent); stop-opacity: .12"/>
        <stop offset="1" style="stop-color: var(--accent); stop-opacity: 0"/>
      </linearGradient>
    </defs>

    <g id="shield">
      <g id="core">
        <g clip-path="url(#sil-clip)">
          <path id="frame" class="ink" d="M0,0 L118,0 L118,22 L22,22 L22,127.98 L92.5,179.8 L185,111.81 L185,138.41 L92.5,206.4 L0,138.41 Z" opacity="0"/>
          <path id="column" class="ink" d="M112,0 L173.5,0 L138.8,25.51 L138.8,160 L112,178 Z" opacity="0"/>
          <path id="leg" class="ink" d="M41.5,33.6 L73,33.6 L73,151.9 L41.5,129 Z" opacity="0"/>
          <path id="crossbar" class="ink" d="M70,68.6 L115,68.6 L115,92.8 L70,92.8 Z" opacity="0"/>
          <g clip-path="url(#stripe-clip)">
          <path id="st0" class="ink stripe" transform="translate(-64.46 47.38)" d="M120,51.98 L185,4.2 L185,13.2 L120,60.98 Z"/>
          <path id="st1" class="ink stripe" transform="translate(-64.46 47.38)" d="M120,73.62 L185,25.85 L185,34.85 L120,82.62 Z"/>
          <path id="st2" class="ink stripe" transform="translate(-64.46 47.38)" d="M120,95.28 L185,47.5 L185,56.5 L120,104.28 Z"/>
          <path id="st3" class="ink stripe" transform="translate(-64.46 47.38)" d="M120,116.92 L185,69.15 L185,78.15 L120,125.92 Z"/>
          <path id="st4" class="ink stripe" transform="translate(-64.46 47.38)" d="M120,138.57 L185,90.8 L185,99.8 L120,147.57 Z"/>
          </g>
          <g clip-path="url(#hot-clip)">
            <path class="hot" opacity="0" d="M120,51.98 L185,4.2 L185,13.2 L120,60.98 Z"/>
            <path class="hot" opacity="0" d="M120,73.62 L185,25.85 L185,34.85 L120,82.62 Z"/>
            <path class="hot" opacity="0" d="M120,95.28 L185,47.5 L185,56.5 L120,104.28 Z"/>
            <path class="hot" opacity="0" d="M120,116.92 L185,69.15 L185,78.15 L120,125.92 Z"/>
            <path class="hot" opacity="0" d="M120,138.57 L185,90.8 L185,99.8 L120,147.57 Z"/>
          </g>
          <g clip-path="url(#ink-clip)">
            <rect id="sheen" x="-62" y="-40" width="110" height="300" fill="url(#sheen-grad)" opacity="0"/>
          </g>
        </g>
      </g>
      <path id="trace-l" class="trace" d="M92.5,206.4 L0,138.41 L0,0 L92.5,0" opacity="0"/>
      <path id="trace-r" class="trace" d="M92.5,206.4 L185,138.41 L185,0 L92.5,0" opacity="0"/>
      <g id="spark-l" opacity="0"><path class="spark" d="M0,0 L-11,-5.5 L-7.5,0 L-11,5.5 Z"/></g>
      <g id="spark-r" opacity="0"><path class="spark" d="M0,0 L-11,-5.5 L-7.5,0 L-11,5.5 Z"/></g>
    </g>

    <g clip-path="url(#word-clip)">
      <g transform="translate(231.6 26.9) scale(1.685)">
        <path class="letter" data-x="0.0" transform="translate(0.0 0)" opacity="0" d="M0,0 H16.9 V25.2 H25.4 V0 H42.3 V68 H25.4 V37.9 H16.9 V68 H0 Z"/>
        <path class="letter" data-x="57.1" transform="translate(57.1 0)" opacity="0" d="M0,0 H17 V68 H0 Z"/>
        <path class="letter" data-x="88.5" transform="translate(88.5 0)" opacity="0" d="M0,10.5 A10.5,10.5 0 0 1 10.5,0 H31.8 A10.5,10.5 0 0 1 42.3,10.5 V21 H25.5 V12.3 H16.6 V55.1 H25.4 V42.7 L20.9,37.6 V29.4 H42.3 V68 H32.8 C30.6,68 28.2,66.2 26.4,64.2 C25.4,66.2 24.2,67.6 22.4,68 H10.5 A10.5,10.5 0 0 1 0,57.5 Z"/>
        <path class="letter" data-x="145.3" transform="translate(145.3 0)" opacity="0" d="M0,0 H16.9 V25.2 H25.4 V0 H42.3 V68 H25.4 V37.9 H16.9 V68 H0 Z"/>
        <path class="letter accent" data-x="202.4" transform="translate(202.4 0)" opacity="0" d="M0,10.5 A10.5,10.5 0 0 1 10.5,0 H31.8 A10.5,10.5 0 0 1 42.3,10.5 V25 H25 V12.3 H16.6 V55.1 H25 V42.2 H42.3 V57.5 A10.5,10.5 0 0 1 31.8,68 H10.5 A10.5,10.5 0 0 1 0,57.5 Z"/>
        <path class="letter accent" data-x="259.1" transform="translate(259.1 0)" opacity="0" d="M0,10.5 A10.5,10.5 0 0 1 10.5,0 H31.8 A10.5,10.5 0 0 1 42.3,10.5 V57.5 A10.5,10.5 0 0 1 31.8,68 H10.5 A10.5,10.5 0 0 1 0,57.5 Z M16.9,12.3 V55.1 H25.4 V12.3 Z"/>
        <path class="letter accent" data-x="316.1" transform="translate(316.1 0)" opacity="0" d="M0,0 H14.5 L29.6,29.3 L44.7,0 H59.2 V68 H42.7 V39.8 L29.6,64.6 L16.5,39.8 V68 H0 Z"/>
      </g>
    </g>
  </svg>
</main>

<footer class="bar">
  <button id="replay" type="button">Replay</button>
  <div class="scrub">
    <input id="scrub" type="range" min="0" max="2720" step="1" value="0" aria-label="Scrub timeline">
    <output id="time" for="scrub">0.00<span> / 2.72 s</span></output>
  </div>
  <button id="slow" type="button" aria-pressed="false">Slow 0.25×</button>
  <div class="seg" role="group" aria-label="Background">
    <button type="button" data-bg="dark" aria-pressed="false">Dark</button>
    <button type="button" data-bg="light" aria-pressed="false">Light</button>
  </div>
</footer>

<script>
(() => {
  const DUR = 2720;
  const CX = 92.5, CY = 103.2;          // shield centre in logo units
  const START_X = 339.5, START_S = 1.35; // shield sits centred and larger before the lockup forms
  const STRIPE_DIR = [-64.46, 47.38]; // along the stripe angle, back into the column

  const $ = id => document.getElementById(id);
  const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const P = (t, s, d) => clamp((t - s) / d);
  const lerp = (a, b, p) => a + (b - a) * p;
  const ease = {
    outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
    outCubic: p => 1 - Math.pow(1 - p, 3),
    inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
    inQuad: p => p * p,
    outBack: p => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
  };
  const mix = m => m <= 0 ? '' : `color-mix(in srgb, var(--accent) ${(m * 100).toFixed(1)}%, var(--fg))`;
  const tf = (el, v) => el.setAttribute('transform', v);
  const op = (el, v) => el.setAttribute('opacity', v.toFixed(3));

  const shield = $('shield'), core = $('core'), frame = $('frame'), column = $('column'),
        leg = $('leg'), bar = $('crossbar'), sheen = $('sheen'),
        flash = $('flash'), clipRect = $('word-clip-rect');
  const traces = [$('trace-l'), $('trace-r')];
  const sparks = [$('spark-l'), $('spark-r')];
  const lens = traces.map(p => p.getTotalLength());
  traces.forEach((p, i) => p.style.strokeDasharray = `${lens[i]} ${lens[i]}`);
  const stripes = [...document.querySelectorAll('.stripe')];   // top to bottom
  const hots = [...document.querySelectorAll('.hot')];         // orange flash layer, same order
  const letters = [...document.querySelectorAll('.letter')];

  // power-on stutter for the frame: two flashes, then it holds
  const FLICKER = [.9, .12, 1];
  const flicker = p => p <= 0 ? 0 : p >= 1 ? 1 : FLICKER[Math.floor(p * FLICKER.length)];

  function render(t) {
    // 1 · hairline traces the silhouette from the chevron point, arrowheads meet at the top
    const tp = ease.inOutCubic(P(t, 0, 520));
    const traceOp = t <= 0 ? 0 : 1 - P(t, 980, 240);
    traces.forEach((p, i) => { p.style.strokeDashoffset = lens[i] * (1 - tp); op(p, traceOp); });
    sparks.forEach((s, i) => {
      const len = lens[i], l = len * tp;
      const pt = traces[i].getPointAtLength(l);
      const a = traces[i].getPointAtLength(Math.min(Math.max(l - 1, 0), len - 1));
      const b = traces[i].getPointAtLength(Math.min(Math.max(l, 1), len));
      const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      // grow in once the two heads have separated, shrink to nothing as they meet
      const v = t <= 0 ? 0 : Math.min(clamp((l - 7) / 18), clamp((len - l - 1) / 18));
      tf(s, `translate(${pt.x} ${pt.y}) rotate(${ang}) scale(${Math.max(v, .001)})`);
      op(s, Math.min(1, v * 1.6));
    });

    // 2 · frame powers on, legs extrude, the crossbar slams home
    op(frame, flicker(P(t, 500, 100)));
    const pl = P(t, 600, 380);
    tf(leg, `translate(0 ${-62 * (1 - ease.outBack(pl))})`); op(leg, P(t, 600, 60));
    const pc = P(t, 640, 320);
    tf(column, `translate(0 ${-90 * (1 - ease.outExpo(pc))})`); op(column, P(t, 640, 50));
    const pb = ease.inQuad(P(t, 800, 180));
    tf(bar, `translate(115 0) scale(${Math.max(pb, .0001)} 1) translate(-115 0)`); op(bar, t > 800 ? 1 : 0);

    // 3 · blades deploy from the column, bottom first
    stripes.forEach((s, k) => {
      const order = stripes.length - 1 - k;
      const d = 1 - ease.outExpo(P(t, 840 + order * 55, 360));
      const move = `translate(${STRIPE_DIR[0] * d} ${STRIPE_DIR[1] * d})`;
      tf(s, move); tf(hots[k], move);
      const sg = 2000 + order * 60;
      op(hots[k], P(t, sg, 80) * (1 - ease.outCubic(P(t, sg + 80, 380))));
    });

    // 4 · lock: pulse, a sheen of orange light across the plate, a breath of orange behind
    const pulse = 1 - .035 * Math.sin(Math.PI * P(t, 980, 240));
    tf(core, `translate(${CX} ${CY}) scale(${pulse}) translate(${-CX} ${-CY})`);
    const ps = P(t, 930, 560);
    const sx = lerp(-155, 345, .5 - Math.cos(Math.PI * ps) / 2);
    tf(sheen, `translate(${sx} 0) rotate(24 -7 110)`);
    op(sheen, ps <= 0 || ps >= 1 ? 0 : Math.min(1, ps / .12, (1 - ps) / .2));
    const pf = P(t, 975, 520);
    flash.style.opacity = (pf <= 0 || pf >= 1 ? 0 : (pf < .08 ? pf / .08 : Math.pow(1 - (pf - .08) / .92, 2)) * .13).toFixed(3);

    // 5 · shield docks left, the wordmark slides out from behind it
    const pm = ease.inOutCubic(P(t, 1200, 620));
    const X = lerp(START_X, 0, pm), S = lerp(START_S, 1, pm);
    tf(shield, `translate(${CX + X} ${CY}) scale(${S}) translate(${-CX} ${-CY})`);
    clipRect.setAttribute('x', (CX + X + CX * S + 8).toFixed(2));
    letters.forEach((l, i) => {
      const s = 1350 + i * 45;
      const e = ease.outExpo(P(t, s, 560));
      tf(l, `translate(${+l.dataset.x - 30 * (1 - e)} 0)`);
      op(l, P(t, s, 180));
      if (l.classList.contains('accent')) {
        // COM lands in logo ink, then ignites orange
        const m = ease.outCubic(P(t, 1740 + (i - 4) * 70, 260));
        l.style.fill = m >= 1 ? 'var(--accent)' : mix(m);
      }
    });
  }

  // ---- playback ----
  const scrub = $('scrub'), time = $('time'), slow = $('slow');
  let t = 0, speed = 1, playing = false, last = null;

  function ui() {
    scrub.value = Math.round(t);
    time.firstChild.nodeValue = (t / 1000).toFixed(2);
  }
  function tick(ts) {
    if (!playing) return;
    const dt = last == null ? 0 : Math.min(ts - last, 50);
    last = ts;
    t = Math.min(DUR, t + dt * speed);
    render(t); ui();
    if (t >= DUR) { playing = false; return; }
    requestAnimationFrame(tick);
  }
  function play(from = 0) {
    t = from; last = null;
    if (!playing) { playing = true; requestAnimationFrame(tick); }
  }

  $('replay').addEventListener('click', () => play(0));
  $('stage').addEventListener('click', () => play(0));
  scrub.addEventListener('input', () => { playing = false; t = +scrub.value; render(t); ui(); });
  slow.addEventListener('click', () => {
    speed = speed === 1 ? .25 : 1;
    slow.setAttribute('aria-pressed', String(speed !== 1));
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey) play(0);
  });

  // background switch: starts from the viewer's theme, then the buttons take over
  const segBtns = [...document.querySelectorAll('.seg button')];
  const currentBg = () => {
    const forced = document.body.dataset.bg;
    if (forced) return forced;
    const fg = getComputedStyle(document.body).getPropertyValue('--fg').trim().toLowerCase();
    return fg === '#000000' || fg === '#000' ? 'light' : 'dark';
  };
  const syncSeg = () => { const v = currentBg(); segBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.bg === v))); };
  segBtns.forEach(b => b.addEventListener('click', () => { document.body.dataset.bg = b.dataset.bg; syncSeg(); }));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncSeg);
  new MutationObserver(syncSeg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  syncSeg();

  // ---- start ----
  render(0); ui();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { t = DUR; render(t); ui(); }
  else {
    const go = () => setTimeout(() => play(0), 350);
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go, go);
  }
})();
</script>
</body>
</html>
